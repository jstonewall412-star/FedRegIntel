name: Refresh dashboard and video archive
on:
  schedule:
        - cron: '17 7 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [youtube-published]
  push:
    branches: [main]
    paths-ignore: ['data/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dashboard-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public data
        id: refresh
        continue-on-error: true
        run: |
          status=0; python scripts/refresh_data.py || status=$?
          python scripts/build_social.py   # picks from whatever snapshot exists, even after a partial failure
          exit $status
      - name: Preserve archive
        run: |
          git config user.name 'FedReg Intel data updater'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Federal Register snapshot and YouTube archive'
            # If another run pushed data meanwhile, keep this run's (newer) snapshot instead of failing
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Stage public site only
        run: |
          mkdir -p _site
          cp index.html privacy.html robots.txt CNAME .nojekyll 9663c4e5600e4c88e3fd12c11e77a13a.txt _site/
          cp -r assets data .well-known _site/   # .well-known/atproto-did verifies the @fedregintel.com Bluesky handle
          python scripts/build_pages.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report a failed source refresh
        if: steps.refresh.outcome == 'failure'
        run: exit 1
